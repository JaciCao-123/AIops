version: '3.8'

services:
  # Neo4j 知识图谱数据库
  neo4j:
    image: neo4j:5-community
    container_name: aiops-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt 协议
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - neo4j-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # AIOps 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aiops-backend
    ports:
      - "8000:8000"
    environment:
      # LLM / vLLM 配置（使用跳板机上的 vLLM 服务）
      - OPENAI_API_KEY=not-needed
      - OPENAI_BASE_URL=http://47.76.53.232:8000/v1
      - OPENAI_MODEL=/opt/models/Qwen3.6-35B-A3B-AWQ-4bit
      # Neo4j 配置
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      # 应用配置
      - DATABASE_URL=sqlite:///./data/aiops.db
      - SECRET_KEY=aiops-local-secret-key-2026
      - DEBUG=true
      # SSH 配置
      - SSH_USER=jaci
      - SSH_KEY_PATH=/root/.ssh/id_rsa
      # 可观测性（Grafana/Prometheus 在跳板机上）
      - GRAFANA_URL=http://47.76.53.232:3000
      - GRAFANA_USERNAME=admin
      - GRAFANA_PASSWORD=${GRAFANA_PASSWORD:-}
      - PROMETHEUS_URL=http://172.21.36.91:9090
      # 邮件审批（从环境变量注入，禁止硬编码密码）
      - SMTP_HOST=${SMTP_HOST:-smtp.163.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-18565693545@163.com}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-18565693545@163.com}
      # 阿里云配置（从环境变量注入，禁止硬编码密钥）
      - ALIYUN_ACCESS_KEY_ID=${ALIYUN_ACCESS_KEY_ID:-}
      - ALIYUN_ACCESS_KEY_SECRET=${ALIYUN_ACCESS_KEY_SECRET:-}
      - ALIYUN_REGION_ID=${ALIYUN_REGION_ID:-cn-hangzhou}
    volumes:
      - backend-data:/app/data
      # SSH 密钥目录（如有需要可挂载本地密钥）
      - ${HOME}/.ssh:/root/.ssh:ro
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # AIOps 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aiops-frontend
    ports:
      - "80:80"
    # 使用自定义 nginx 配置处理 /aiops 前缀
    # 构建时默认 nginx.conf 用于 K8s（Ingress 剥离 /aiops）
    # Docker 部署时覆盖为支持 /aiops 前缀的配置
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  neo4j-data:
  backend-data:
