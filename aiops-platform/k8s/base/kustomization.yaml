apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: aiops

resources:
  - namespace.yaml
  - configmap.yaml
  # 敏感信息改用 SealedSecret（由 k8s/scripts/seal-secrets.sh 生成，数据已加密）
  # 旧明文 secret.yaml / ssh-secret.yaml 已移除，明文源在 gitignored 的 k8s/secrets-plain/
  - sealed-secrets
  - init-dirs.yaml
  - neo4j-pvc.yaml
  - neo4j-deployment.yaml
  - neo4j-service.yaml
  - backend-deployment.yaml
  - frontend-deployment.yaml
  - ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: aiops-platform
      app.kubernetes.io/managed-by: argocd
    includeSelectors: true
