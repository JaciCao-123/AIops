apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: aiops-dev

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: aiops-backend
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: aiops/backend:dev
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "250m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"

  - target:
      kind: Deployment
      name: aiops-frontend
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: aiops/frontend:dev

namePrefix: dev-
