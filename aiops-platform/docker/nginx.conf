server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 根路径重定向到 /aiops/（React Router 使用 /aiops 作为 basename）
    location = / {
        return 301 /aiops/;
    }

    # SPA 路由支持（非 /aiops 路径的 fallback）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源 - 处理 /aiops/assets/ 前缀（前端构建产物使用 /aiops/ 基础路径）
    # 使用 ^~ 防止被底部的正则 location 覆盖导致 alias 失效
    location ^~ /aiops/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由 - 处理 /aiops/ 路径（React Router 使用 /aiops/ 作为基础路径）
    location /aiops/ {
        try_files $uri /index.html;
    }

    # API 反向代理 - 处理 /aiops/api/ 前缀（Ingress 风格）
    # 前端请求路径：/aiops/api/multi-agent/process
    # 后端实际路径：/api/multi-agent/process
    # 此配置剥离 /aiops 前缀再转发到后端
    location /aiops/api/ {
        rewrite ^/aiops(/.*)$ $1 break;
        proxy_pass http://aiops-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # 直接 /api/ 路径也转发到后端（兼容性）
    location /api/ {
        proxy_pass http://aiops-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # WebSocket 代理
    location /ws/ {
        proxy_pass http://aiops-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
