apiVersion: v1
kind: ConfigMap
metadata:
  name: sample-app-code
  namespace: observability
data:
  app.py: |
    import os
    import time
    import random
    from flask import Flask, jsonify
    from opentelemetry import trace
    from opentelemetry.sdk.trace import TracerProvider
    from opentelemetry.sdk.trace.export import BatchSpanProcessor
    from opentelemetry.exporter.otlp.proto.grpc.trace_exporter import OTLPSpanExporter

    SERVICE_NAME = os.environ.get("SERVICE_NAME", "sample-app")
    OTEL_ENDPOINT = os.environ.get("OTEL_EXPORTER_OTLP_ENDPOINT", "http://otel-agent.observability.svc.cluster.local:4317")

    provider = TracerProvider()
    provider.add_span_processor(BatchSpanProcessor(OTLPSpanExporter(endpoint=OTEL_ENDPOINT)))
    trace.set_tracer_provider(provider)

    app = Flask(SERVICE_NAME)
    tracer = trace.get_tracer(__name__)

    @app.route("/health")
    def health():
        return jsonify({"status": "healthy", "service": SERVICE_NAME})

    @app.route("/")
    def index():
        with tracer.start_as_current_span("sample-app-index"):
            time.sleep(random.uniform(0.01, 0.05))
            return jsonify({
                "service": SERVICE_NAME,
                "message": "Hello from K8s sample app!",
                "timestamp": time.time()
            })

    @app.route("/error")
    def trigger_error():
        with tracer.start_as_current_span("error-span"):
            raise Exception("This is a test error from K8s!")

    if __name__ == "__main__":
        app.run(host="0.0.0.0", port=5000, debug=False)
